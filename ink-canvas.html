<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ink Canvas Demo</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
      margin: 0;
      background: #f0f0f0;
      color: #111;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      background: #fff;
      cursor: crosshair;
    }
  </style>
</head>
<body>
  <canvas id="ink-canvas"></canvas>
  <script type="module" src="./ink-canvas.js"></script>
</body>
</html>
